<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c8262c;
    --green: #15924a;
    --yellow: #f4c400;
    --blue: #0464b6;
    --ink: #111;
    --paper: #fff;
    --grid-bg: #eef3f2;
    --grid-line: #c9cfcf;
    --cell: 24px;
    /* Headline: placeholder até chegar o arquivo da fonte escolhida pelo usuário */
    --head: "Russo One", "Arial Black", sans-serif;
    --body: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background-color: var(--grid-bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    line-height: 1.65;
    font-size: 18px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }

  header.site {
    position: relative;
    background: var(--paper);
    border: 3px solid var(--ink);
    padding: 22px 24px 18px;
    margin-bottom: 28px;
  }
  .stripes { display: flex; height: 10px; margin: -22px -24px 18px; }
  .stripes span { flex: 1; }
  .stripes .r { background: var(--red); }
  .stripes .g { background: var(--green); }
  .stripes .y { background: var(--yellow); }
  .stripes .b { background: var(--blue); }
  .site-name {
    font-family: var(--head);
    font-size: clamp(30px, 6vw, 48px);
    line-height: 1;
    margin: 0;
    letter-spacing: 0.5px;
    transform: skewX(-10deg);
    transform-origin: left bottom;
    text-transform: uppercase;
  }
  .site-name a { color: var(--ink); text-decoration: none; }
  .site-sub {
    margin: 10px 0 0;
    color: var(--red);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  article {
    position: relative;
    background: var(--paper);
    border: 3px solid var(--ink);
    padding: 40px 40px 28px;
  }
  .badge {
    position: absolute;
    top: -26px; right: -14px;
    width: 104px; height: 104px;
    background: var(--yellow);
    color: var(--ink);
    display: grid; place-items: center;
    text-align: center;
    font-family: var(--head);
    font-size: 15px; line-height: 1.05;
    text-transform: uppercase;
    clip-path: polygon(50% 0%, 61% 18%, 82% 10%, 79% 32%, 100% 38%, 84% 54%, 96% 74%, 74% 76%, 68% 98%, 50% 85%, 32% 98%, 26% 76%, 4% 74%, 16% 54%, 0% 38%, 21% 32%, 18% 10%, 39% 18%);
    transform: rotate(8deg);
  }
  .badge b { display: block; font-size: 30px; font-weight: 400; }
  .kicker {
    color: var(--blue);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--head);
    font-weight: 400;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.12;
    margin: 0 0 26px;
    padding-right: 70px;
  }
  article p { margin: 0 0 1.1em; }
  figure { margin: 32px -12px; }
  figure img {
    display: block; width: 100%; height: auto;
    border: 3px solid var(--ink);
    /* tela de CRT, como os screenshots nas caixas de jogos e consoles da época */
    border-radius: 3.5% / 5%;
    background: #000;
    cursor: zoom-in;
  }
  figure img.px { image-rendering: pixelated; }
  @media (min-width: 900px) {
    figure { margin: 36px -110px; }
  }
  .zoom {
    position: fixed; inset: 0; z-index: 50;
    background: #000;
    overflow: auto; -webkit-overflow-scrolling: touch;
    display: none;
  }
  .zoom.on { display: block; }
  .zoom img {
    display: block; margin: auto;
    max-width: 100vw; max-height: 100vh;
    width: auto; height: auto;
    position: relative; top: 50%; transform: translateY(-50%);
    cursor: zoom-in;
  }
  .zoom.big img {
    max-width: none; max-height: none;
    width: 250vw; top: 0; transform: none; cursor: zoom-out;
  }
  .zoom img.px { image-rendering: pixelated; }
  .zoom .x {
    position: fixed; top: 10px; right: 10px; z-index: 51;
    width: 44px; height: 44px; border: 3px solid #fff; background: var(--red);
    color: #fff; font: 700 24px/36px sans-serif; text-align: center; cursor: pointer;
  }
  .zoom .tip {
    position: fixed; left: 0; right: 0; bottom: 12px; text-align: center;
    color: #ccc; font-size: 13px; pointer-events: none;
  }
  figcaption a { color: var(--blue); }
  figcaption {
    font-size: 15px;
    color: #444;
    padding: 8px 4px 0;
    border-left: 6px solid var(--green);
    padding-left: 10px;
    margin-top: 10px;
    margin-left: 12px; margin-right: 12px;
  }
  @media (min-width: 900px) {
    figcaption { margin-left: 110px; margin-right: 110px; }
  }
  .note {
    display: inline;
    background: var(--yellow);
    font-size: 14px;
    padding: 1px 6px;
  }
  .how {
    margin-top: 34px;
    padding: 16px 18px;
    background: #f3f7fb;
    border-left: 6px solid var(--blue);
    font-size: 15px;
    color: #333;
  }
  h2 {
    font-family: var(--head);
    font-weight: 400;
    font-size: 24px;
    line-height: 1.2;
    margin: 34px 0 12px;
  }
  pre.term {
    background: #0b0b0b;
    color: #e8e8e8;
    border: 3px solid var(--ink);
    padding: 14px 16px;
    margin: 24px -12px;
    overflow-x: auto;
    font: 14px/1.5 Consolas, "Cascadia Mono", Menlo, monospace;
    white-space: pre-wrap;
  }
  .posts-nav { display: flex; gap: 12px; justify-content: space-between; margin-top: 18px; flex-wrap: wrap; }
  .posts-nav a {
    background: var(--paper); border: 3px solid var(--ink); padding: 10px 14px;
    color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; max-width: 48%;
  }
  .posts-nav .next { margin-left: auto; text-align: right; }
  .posts-nav a:hover { background: var(--yellow); }
  .list { display: grid; gap: 16px; }
  .card {
    display: flex; gap: 18px; align-items: stretch;
    background: var(--paper); border: 3px solid var(--ink);
    color: var(--ink); text-decoration: none;
  }
  .card:hover { box-shadow: 6px 6px 0 var(--ink); transform: translate(-3px, -3px); }
  .card .num {
    flex: 0 0 88px; display: grid; place-items: center;
    background: var(--red); color: #fff; border-right: 3px solid var(--ink);
    font-family: var(--head); font-size: 40px;
  }
  .card:nth-child(4n+2) .num { background: var(--green); }
  .card:nth-child(4n+3) .num { background: var(--yellow); color: var(--ink); }
  .card:nth-child(4n+4) .num { background: var(--blue); }
  .card .txt { padding: 16px 18px 16px 0; display: grid; gap: 4px; }
  .card .t { font-family: var(--head); font-size: 22px; line-height: 1.2; }
  .card .ex { color: #444; font-size: 16px; }
  .card .kicker { margin: 0; }
  footer.site {
    margin-top: 28px;
    background: var(--blue);
    color: #fff;
    border: 3px solid var(--ink);
    padding: 14px 20px;
    font-size: 14px;
  }
  footer.site p { margin: 0; }
  @media (max-width: 560px) {
    .card .num { flex-basis: 64px; font-size: 30px; }
    .posts-nav a { max-width: 100%; }
    pre.term { margin: 20px -4px; font-size: 12.5px; }
    body { font-size: 17px; }
    article { padding: 34px 20px 22px; }
    figure { margin: 26px -39px; }
    figcaption { margin-left: 39px; margin-right: 39px; }
    .badge { width: 84px; height: 84px; font-size: 12px; right: -6px; }
    .badge b { font-size: 24px; }
    h1 { padding-right: 52px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="stripes"><span class="r"></span><span class="g"></span><span class="y"></span><span class="b"></span></div>
    <p class="site-name"><a href="{{HOME}}">Symphony of the Night</a></p>
    <p class="site-sub">A Mega CD port &middot; Development log</p>
  </header>

{{CONTENT}}

  <footer class="site">
    <p>A fan project. Symphony of the Night belongs to Konami; Mega Drive and Mega CD belong to Sega. No game files are distributed here.</p>
  </footer>
</div>
<div class="zoom" id="zoom"><div class="x" id="zoomx">&times;</div><img id="zoomimg" alt=""><div class="tip">tap to zoom &middot; &times; to close</div></div>
<script>
(function () {
  var z = document.getElementById('zoom'), zi = document.getElementById('zoomimg');
  document.querySelectorAll('figure img').forEach(function (im) {
    im.addEventListener('click', function () {
      zi.src = im.currentSrc || im.src; zi.className = im.className;
      z.className = 'zoom on'; document.body.style.overflow = 'hidden';
    });
  });
  function fecha() { z.className = 'zoom'; zi.src = ''; document.body.style.overflow = ''; }
  document.getElementById('zoomx').addEventListener('click', fecha);
  z.addEventListener('click', function (e) { if (e.target === z) fecha(); });
  zi.addEventListener('click', function (e) {
    var big = z.className.indexOf('big') < 0;
    var rx = e.offsetX / zi.clientWidth, ry = e.offsetY / zi.clientHeight;
    z.className = big ? 'zoom on big' : 'zoom on';
    if (big) { z.scrollLeft = rx * zi.clientWidth - innerWidth / 2; z.scrollTop = ry * zi.clientHeight - innerHeight / 2; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecha(); });
})();
</script>
</body>
</html>
