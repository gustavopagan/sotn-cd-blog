<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
{{FONTES}}
<style>
  /* Visual: a caixa japonesa do Mega-CD (KV aprovado em 18/11). Papel creme quadriculado com
     grade de 24 px centralizada; tudo encaixado nela. CD Drive nos cabeçalhos, monoMMM_5 nos
     textos curtos, Archivo no texto corrido. */
  :root {
    --ink: #18181A; --red: #D2232A; --blue: #1B56B0; --navy: #1E2C66; --yellow: #F3D23C;
    --faixa: #AE2900; --paper: #EAE6DA; --cream: #FBF7E8;
    --cd: "CD Drive", "Archivo", sans-serif;
    --mono: "monoMMM5", ui-monospace, monospace;
    --body: "Archivo", system-ui, sans-serif;
    --chk: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 4px 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--paper); overflow-x: hidden; }
  body { overflow-x: hidden; overflow-x: clip; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 24px; }
  /* A GRADE. Um bloco só segura o site inteiro e pinta o quadriculado, então fundo e conteúdo têm a
     mesma origem por construção. A largura é sempre um número inteiro de casas (de 48 em 48 px no
     computador, para o que é centralizado cair em casa inteira; de 24 em 24 no celular) e a borda
     esquerda cai num pixel inteiro. Tudo dentro dela mede múltiplos de 24 px na horizontal e na
     vertical; src/grade_test.py confere isso no build. */
  .grade { --W: min(1056px, round(down, 100% - 48px, 48px)); position: relative; isolation: isolate;
    width: 1056px; max-width: calc(100% - 48px); margin: 0 auto;
    width: var(--W); max-width: none; margin-left: round(down, (100% - var(--W)) / 2, 1px);
    min-height: 100vh; container-type: inline-size; }
  .grade::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: -4800px; right: -4800px;
    background-image: linear-gradient(rgba(38,48,70,.14) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(38,48,70,.14) 1px, transparent 1px);
    background-size: 24px 24px; }
  /* Com zoom ou escala de tela quebrados (110%, por exemplo) uma casa não tem um número inteiro de
     pixels do aparelho. Fundo repetido sai do lugar aos poucos e degradê único dá moiré. Por isso o
     script risca o quadriculado com um elemento por linha (.fundo): o navegador encaixa cada linha
     no pixel do mesmo jeito que encaixa as bordas do conteúdo. O fundo em CSS acima fica para quem
     está sem script. */
  .grade.riscada::before { content: none; }
  .fundo { position: absolute; z-index: -1; top: 0; bottom: 0; left: -4800px; right: -4800px; overflow: hidden; pointer-events: none; }
  .fundo i { position: absolute; background: rgba(38,48,70,.14); }
  .fundo .h { left: 0; right: 0; height: 1px; }
  .fundo .v { top: 0; bottom: 0; width: 1px; }
  a { color: var(--blue); }
  .w720 { width: min(720px, 100%); margin: 0 auto; }
  /* dentro de um parágrafo, link, itálico e código não aumentam a linha: quem manda é o parágrafo */
  article p :is(a, em, i, strong, b, code, span) { line-height: 0; }
  pre.term code { font: inherit; }
  .calco { display: block; }
  .cdx { font-family: var(--cd); font-weight: 400; text-transform: uppercase; }
  .mono { font-family: var(--mono); letter-spacing: -.012em; text-transform: uppercase; }

  /* cabeçalho do site */
  header.site { padding-top: 24px; padding-bottom: 24px; }
  .hdr { display: flex; align-items: flex-start; gap: 48px; isolation: isolate; }
  .hdr .tt { flex: 1; min-width: 0; }
  .jp { height: 24px; font: 900 15px/24px var(--mono), "Noto Sans JP", sans-serif; letter-spacing: .12em; }
  .wordmark { margin: 0; font-family: var(--cd); font-size: 64px; line-height: 72px; text-transform: uppercase; }
  .wordmark a { color: var(--ink); text-decoration: none; }
  .sub2 { height: 24px; display: flex; align-items: center; gap: 12px; }
  .sub2 span { font: 400 17px/24px var(--mono); letter-spacing: -.012em; color: var(--red); text-transform: uppercase; white-space: nowrap; }
  .sub2 i { flex: 1; height: 3px; background: var(--ink); }
  .badge { position: relative; flex: 0 0 auto; width: 96px; height: 120px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--ink); color: #fff; text-decoration: none; }
  .badge::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: translate(8px, 8px); background: var(--chk); }
  .badge span { font: 400 14px/24px var(--mono); letter-spacing: .1em; }
  .badge b { font: 400 44px/48px var(--mono); color: var(--yellow); }

  /* post */
  .kicker { height: 24px; margin-top: 24px; font: 400 17px/24px var(--mono); letter-spacing: -.012em; color: var(--blue); text-transform: uppercase; }
  /* Narrador: [gus] vermelho, [claude] azul; nome em texto, linha à esquerda no grid. */
  .voz { margin: 24px 0; }
  .vl { border-left: 3px solid var(--red); padding-left: 21px; }
  .voz-claude .vl { border-left-color: var(--blue); }
  .voz > :last-child, .vl > :last-child { margin-bottom: 0; }
  figure + .vl { margin-top: 48px; }
  /* nome de quem fala: retângulo do aviso "Draft" (cor e fonte), em cima da linha, com largura de casas
     inteiras do quadriculado (GUS 2, CLAUDE 3) para as quatro bordas caírem nas linhas */
  .voz .quem { display: block; width: 48px; height: 24px; margin: 0; padding: 0; text-align: center; background: var(--red); color: #fff;
    font: 400 15px/24px var(--mono); text-transform: uppercase; }
  .voz-claude .quem { width: 72px; background: var(--blue); }
  h1.ttl { margin: 0 0 24px; font-family: var(--cd); font-weight: 400; font-size: 42px; line-height: 48px; text-transform: uppercase; }
  article, .list, figure { isolation: isolate; }
  article p { margin: 0 0 24px; }
  .note { display: inline-block; background: var(--red); color: #fff; font: 400 15px/24px var(--mono); padding: 0 8px; text-transform: uppercase; margin-bottom: 24px; }
  .secr { display: flex; align-items: center; gap: 24px; height: 48px; margin: 48px 0 24px; isolation: isolate; }
  .secr i { flex: 1; height: 3px; background: var(--ink); }
  h2.sec { position: relative; margin: 0; height: 48px; line-height: 50px; padding: 0 24px; background: var(--red); color: #fff;
    font-family: var(--cd); font-weight: 400; font-size: 22px; text-transform: uppercase; white-space: nowrap; }
  h2.sec::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: translate(8px, 8px); background: var(--chk); }
  .quote { position: relative; margin: 48px 0; }
  .quote::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: translate(8px, 8px); background: var(--chk); }
  .quote .in { background: var(--yellow); box-shadow: inset 0 0 0 2px var(--ink); padding: 24px; }
  .quote .q { margin: 0; font: italic 700 20px/24px var(--body); }
  .quote .tr { margin: 0; font-size: 13px; line-height: 24px; }
  pre.term { background: var(--ink); color: #E6E9F5; padding: 12px 24px; margin: 24px 0 48px; overflow-x: auto;
    font: 15px/24px var(--mono); white-space: pre-wrap; }
  .how { position: relative; margin: 48px 0 0; background: #D6E7F6; }
  .how::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: translate(8px, 8px); background: var(--chk); }
  .how .bar { height: 24px; background: var(--navy); color: #fff; display: flex; align-items: center; padding: 0 11px; white-space: nowrap; overflow: hidden; }
  .how .bar b { font: 400 29px/24px var(--cd); transform: scaleY(.87); position: relative; top: 1px; margin-right: .238em; }
  .how .bar span { font: 400 17px/24px var(--mono); letter-spacing: -.012em; color: #E6E9F5; }
  .how p { margin: 0; padding: 24px; font-size: 15px; }

  /* figuras: largura de 960 no computador, a coluna no celular */
  figure { --fw: min(960px, var(--gw, 100cqw)); position: relative; left: 50%; width: var(--fw); margin: 48px 0 0 calc(var(--fw) / -2); }
  figure + p, figure + .secr, figure + figure { margin-top: 48px; }
  figure img { display: block; width: 100%; height: auto; }
  figure picture { display: block; }
  figure img.px { image-rendering: pixelated; }
  /* a altura de cada imagem (--r = altura/largura e --k = moldura, vindas do build) é completada
     até a casa seguinte na margem da legenda */
  figure { --H: calc((var(--fw) - var(--k, 0px)) * var(--r, 1) + var(--k, 0px)); }
  figure { display: grid; grid-template-columns: 100%; grid-template-rows: round(up, var(--H), 24px) auto; }
  figure > :first-child { align-self: start; }
  figure, .voz > figure:last-child { margin-bottom: 48px; }
  figure > .cap { margin-bottom: 0; }
  .cap { display: flex; gap: 24px; align-items: flex-start; width: min(720px, 100%); margin: 24px auto 48px; }
  .cap .num { flex: 0 0 24px; height: 24px; background: var(--red); color: #fff; font: 400 17px/24px var(--mono); text-align: center; }
  .cap p { margin: 0; font-size: 15px; line-height: 24px; color: #3a3a3e; }
  /* tela de CRT: bordas abauladas (#crt) e sombra dura em xadrez */
  .crt { display: block; position: relative; cursor: zoom-in; }
  .crt::before { content: ""; position: absolute; inset: 0; transform: translate(8px, 8px); background: var(--chk);
    -webkit-clip-path: url(#crt); clip-path: url(#crt); z-index: 0; pointer-events: none; transition: transform .28s ease-out; }
  .crt.so::before { transform: translate(-8px, 8px); }
  .tubo { position: relative; z-index: 1; display: block; background: var(--ink); padding: 4px; -webkit-clip-path: url(#crt); clip-path: url(#crt); }
  .tubo img { -webkit-clip-path: url(#crt); clip-path: url(#crt); background: #000; }
  .degrau { position: relative; aspect-ratio: var(--ar); }
  .degrau .crt { position: absolute; left: var(--l); top: var(--t); width: var(--w); }
  .crt.sobe { animation: sobe .32s ease-out; }
  @keyframes sobe { 0% { transform: translateY(6px) scale(.97); } 55% { transform: translateY(-5px) scale(1.025); } 100% { transform: none; } }
  /* painel (diagramas e gráficos): chapado, sem tubo, sombra em xadrez */
  .painel { position: relative; display: block; cursor: zoom-in; }
  .painel::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: translate(8px, 8px); background: var(--chk); }

  /* navegação e lista */
  .posts-nav { display: flex; gap: 24px 48px; margin-top: 72px; }
  .posts-nav a { flex: 1; display: block; text-decoration: none; color: var(--ink); background: var(--cream);
    box-shadow: inset 0 0 0 2px var(--ink); padding: 12px 24px; min-height: 72px; }
  .posts-nav a:hover { background: #fff; }
  .posts-nav .d { display: block; color: var(--red); font: 400 17px/24px var(--mono); letter-spacing: -.012em; text-transform: uppercase; }
  .posts-nav .t { display: block; font: 400 20px/24px var(--cd); text-transform: uppercase; }
  .posts-nav .next { text-align: right; }
  .list { display: grid; gap: 48px; padding-top: 24px; }
  .card { position: relative; display: block; text-decoration: none; color: var(--ink); background: var(--cream); }
  .card::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: translate(8px, 8px); background: var(--chk); }
  .card .bar { height: 24px; background: var(--navy); color: #fff; display: flex; align-items: center; padding: 0 11px; white-space: nowrap; overflow: hidden; }
  .card .bar b { font: 400 29px/24px var(--cd); transform: scaleY(.87); position: relative; top: 1px; margin-right: .238em; }
  .card .bar span { font: 400 17px/24px var(--mono); letter-spacing: -.012em; color: #E6E9F5; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .card .t { display: block; padding: 24px 24px 0; font: 400 26px/24px var(--cd); text-transform: uppercase; }
  .card .ex { display: block; padding: 24px; font-size: 15px; color: #3a3a3e; }
  .card:hover .t { color: var(--red); }

  footer.site { padding-top: 48px; padding-bottom: 24px; }
  footer.site .rule { height: 3px; margin-bottom: -3px; background: var(--ink); }
  footer.site .row { display: flex; align-items: center; gap: 0 24px; min-height: 72px; flex-wrap: wrap; }
  footer.site p { flex: 1 1 360px; margin: 0; font-size: 13px; line-height: 24px; color: #3a3a3e; }
  footer.site .marca { font: 400 40px/48px var(--cd); color: var(--blue); }

  .zoom { position: fixed; inset: 0; z-index: 50; background: #000; overflow: auto; -webkit-overflow-scrolling: touch; display: none; }
  .zoom.on { display: block; }
  .zoom img { display: block; margin: auto; max-width: 100vw; max-height: 100vh; width: auto; height: auto;
    position: relative; top: 50%; transform: translateY(-50%); cursor: zoom-in; }
  .zoom.big img { max-width: none; max-height: none; width: 250vw; top: 0; transform: none; cursor: zoom-out; }
  .zoom img.px { image-rendering: pixelated; }
  .zoom .x { position: fixed; top: 10px; right: 10px; z-index: 51; width: 48px; height: 48px; background: var(--red);
    color: #fff; font: 400 24px/48px var(--mono); text-align: center; cursor: pointer; }
  .zoom .seta { position: fixed; top: 50%; z-index: 51; transform: translateY(-50%); width: 48px; height: 72px; background: var(--navy);
    color: #fff; font: 400 32px/72px var(--mono); text-align: center; cursor: pointer; user-select: none; }
  .zoom .seta.ant { left: 8px; } .zoom .seta.prox { right: 8px; }
  .zoom.so1 .seta, .zoom.big .seta { display: none; }
  .zoom .tip { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: #ccc; font: 13px/24px var(--mono); pointer-events: none; }

  /* celular: coluna de 336 px presa à grade */
  @media (max-width: 700px) {
    .grade { --W: round(down, 100% - 24px, 24px); }
    figure { --H: calc((var(--fw) - var(--k, 0px)) * var(--rm, var(--r, 1)) + var(--k, 0px)); }
    .hdr { flex-direction: column; gap: 0; }
    .badge { order: -1; width: auto; height: 48px; flex-direction: row; gap: 12px; padding: 0 12px; margin-bottom: 24px; }
    .badge b { font-size: 28px; }
    .wordmark { font-size: min(40px, 11cqw); line-height: 48px; }
    .sub2 span { font-size: 14px; }
    h1.ttl { font-size: min(40px, 11cqw); line-height: 48px; }
    h2.sec { font-size: 20px; padding: 0 12px; }
    .secr { gap: 12px; }
    .degrau.zz { aspect-ratio: var(--zar); }
    .degrau.zz .crt { left: var(--zl); top: var(--zt); width: var(--zw); }
    .posts-nav { flex-direction: column; }
    .card .t { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="grade">
<header class="site">
  <div class="hdr">
    <div class="tt">
      <div class="jp">メガCD移植・開発日誌</div>
      <p class="wordmark"><a href="{{HOME}}">Symphony of the Night</a></p>
      <div class="sub2"><span>A Mega CD port &middot; Development log</span><i></i></div>
    </div>
    {{BADGE}}
  </div>
</header>
<main>
{{CONTENT}}
</main>
<footer class="site">
  <div>
    <div class="rule"></div>
    <div class="row">
      <p>A fan project. Symphony of the Night belongs to Konami; Mega Drive and Mega CD belong to Sega. No game files are distributed here.</p>
      <div class="marca">SOTN&middot;CD</div>
    </div>
  </div>
</footer>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="crt" clipPathUnits="objectBoundingBox"><path d="M.07,.02 Q.5,-.012 .93,.02 Q.985,.024 .988,.08 Q1.008,.5 .988,.92 Q.985,.976 .93,.98 Q.5,1.012 .07,.98 Q.015,.976 .012,.92 Q-.008,.5 .012,.08 Q.015,.024 .07,.02Z"/></clipPath></svg>
<div class="zoom" id="zoom"><div class="x" id="zoomx">&times;</div><div class="seta ant" id="zoomant">&lsaquo;</div><div class="seta prox" id="zoomprox">&rsaquo;</div><img id="zoomimg" alt=""><div class="tip">tap to zoom &middot; &times; to close</div></div>
<script>
/* Rede de segurança da grade. O alinhamento é do CSS (.grade); isto só age quando o navegador
   foge dele: sem round() no CSS, ou com uma fonte reserva que muda a altura de uma linha. Aí cada
   bloco fora do quadriculado ganha um calço antes dele. window.sotnGrade() diz quantos estão fora. */
(function () {
  var g = document.querySelector('.grade'); if (!g) return;
  var SEL = '.kicker, h1.ttl, .note, .quem, .vl > *, figure, figure > .cap, .secr, .how, .posts-nav, footer.site';
  var velho = !(window.CSS && CSS.supports && CSS.supports('width', 'round(down, 1px, 1px)'));
  function erro(e, t0) { var r = (e.getBoundingClientRect().top - t0) % 24; return r > 23.25 || r < 0.75 ? 0 : r; }
  window.sotnGrade = function () {
    var t0 = g.getBoundingClientRect().top, n = 0;
    g.querySelectorAll(SEL + ', .card, .cap .num').forEach(function (e) { if (erro(e, t0)) n++; });
    return { fora: n, calcos: g.querySelectorAll('.calco').length, largura: g.getBoundingClientRect().width,
             esquerda: g.getBoundingClientRect().left };
  };
  /* Régua de conferência: risca em vermelho, pela posição real dos blocos, uma linha a cada 24 px na
     borda esquerda e mostra as medidas do navegador. Se o risco bate com a etiqueta e não com o
     quadriculado, quem saiu do lugar foi o fundo; se bate com o fundo, foi o conteúdo. */
  window.sotnRegua = function () {
    var v = g.querySelector('.regua'); if (v) { v.remove(); document.getElementById('reguainfo').remove(); return; }
    v = document.createElement('div'); v.className = 'regua';
    v.style.cssText = 'position:absolute;top:0;bottom:0;left:-24px;width:48px;pointer-events:none;z-index:40;' +
      'background:repeating-linear-gradient(rgba(255,0,0,.0) 0 0)';
    var n = Math.floor(g.getBoundingClientRect().height / 24), h = '';
    for (var i = 0; i < n; i++) h += '<i style="position:absolute;left:0;right:0;height:1px;background:#f0f;top:' + (i * 24) + 'px"></i>';
    v.innerHTML = h; g.appendChild(v);
    var s = window.sotnGrade(), q = g.querySelectorAll('.quem'), u = q[q.length - 1];
    var d = document.createElement('div'); d.id = 'reguainfo';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:60;background:#000;color:#0f0;font:12px/18px monospace;padding:6px 10px;white-space:pre-wrap';
    d.textContent = 'GRADE dpr=' + window.devicePixelRatio + ' janela=' + window.innerWidth + 'x' + window.innerHeight +
      ' zoomVV=' + (window.visualViewport ? visualViewport.scale : '?') + ' grade=' + s.largura + '@' + s.esquerda +
      ' fora=' + s.fora + ' calcos=' + s.calcos + ' alt=' + g.getBoundingClientRect().height +
      (u ? ' ultimaEtiqueta=' + (u.getBoundingClientRect().top - g.getBoundingClientRect().top) : '') +
      ' round=' + !velho + '\n' + navigator.userAgent;
    document.body.appendChild(d);
  };
  var fundo = null, fh = -1, fw = -1;
  function risca() {
    var r = g.getBoundingClientRect(), nh = Math.ceil(r.height / 24), vw = document.documentElement.clientWidth;
    var e = Math.ceil(r.left / 24) + 2, d = Math.ceil((vw - r.left) / 24) + 2;
    if (fundo && nh === fh && e * 1000 + d === fw) return;
    fh = nh; fw = e * 1000 + d;
    var h = '', i;
    for (i = 0; i < nh; i++) h += '<i class="h" style="top:' + (i * 24) + 'px"></i>';
    for (i = -e; i < d; i++) h += '<i class="v" style="left:' + (4800 + i * 24) + 'px"></i>';
    if (!fundo) { fundo = document.createElement('div'); fundo.className = 'fundo'; fundo.setAttribute('aria-hidden', 'true'); g.insertBefore(fundo, g.firstChild); g.classList.add('riscada'); }
    fundo.innerHTML = h;
  }
  var ocupado = false;
  function grade() {
    if (ocupado) return; ocupado = true;
    if (velho) {
      var b = document.documentElement.clientWidth;
      var w = b <= 700 ? Math.floor((b - 24) / 24) * 24 : Math.min(1056, Math.floor((b - 48) / 48) * 48);
      g.style.width = w + 'px'; g.style.maxWidth = 'none'; g.style.marginLeft = Math.floor((b - w) / 2) + 'px';
      g.style.setProperty('--gw', w + 'px');
      g.querySelectorAll('figure > :first-child').forEach(function (e) {
        var h = e.getBoundingClientRect().height, c = e.parentNode.querySelector('.cap');
        if (c) c.style.marginTop = (24 + Math.ceil(h / 24 - 0.01) * 24 - h) + 'px';
      });
    }
    g.querySelectorAll('.calco').forEach(function (c) { c.remove(); });
    var t0 = g.getBoundingClientRect().top;
    g.querySelectorAll(SEL).forEach(function (e) {
      var r = erro(e, t0); if (!r) return;
      var c = document.createElement('i'); c.className = 'calco'; c.style.height = (24 - r) + 'px';
      e.parentNode.insertBefore(c, e);
      var r2 = erro(e, t0); if (r2) c.style.height = ((24 - r) + (24 - r2)) % 24 + 'px';
    });
    risca();
    setTimeout(function () { ocupado = false; }, 0);
  }
  grade();
  window.addEventListener('load', grade);
  window.addEventListener('resize', grade);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(grade);
  if (window.ResizeObserver) new ResizeObserver(risca).observe(g);
})();

// Post abre no topo (o navegador às vezes mantinha a rolagem da página anterior).
(function(){try{
  var n=performance.getEntriesByType('navigation')[0];
  if(!location.hash && (!n||n.type==='navigate')){
    if('scrollRestoration' in history) history.scrollRestoration='manual';
    scrollTo(0,0);
    var h=document.documentElement; if(h.scrollIntoView) h.scrollIntoView({block:'start'});
  }
}catch(e){}})();
(function () {
  var z = document.getElementById('zoom'), zi = document.getElementById('zoomimg');
  var todas = Array.prototype.slice.call(document.querySelectorAll('figure img')), atual = 0;
  function mostra(i) {
    atual = (i + todas.length) % todas.length; var im = todas[atual];
    zi.src = im.currentSrc || im.src; zi.className = im.className;
    z.className = 'zoom on' + (todas.length < 2 ? ' so1' : ''); document.body.style.overflow = 'hidden';
  }
  todas.forEach(function (im, i) {
    (im.closest('.crt') || im).addEventListener('click', function () { mostra(i); });
  });
  document.getElementById('zoomant').addEventListener('click', function (e) { e.stopPropagation(); mostra(atual - 1); });
  document.getElementById('zoomprox').addEventListener('click', function (e) { e.stopPropagation(); mostra(atual + 1); });
  var grupos = [];
  document.querySelectorAll('.degrau').forEach(function (g) {
    var cs = Array.prototype.slice.call(g.querySelectorAll('.crt')), n = cs.length;
    // a tela sob o mouse fica por cima; as outras se empilham a partir dela, como cartas,
    // e cada sombra cai sobre a vizinha que está por baixo
    function topo(k) {
      cs.forEach(function (c, j) {
        c.style.zIndex = n - Math.abs(j - k);
        var esq = j > k || (j === k && k === n - 1 && n > 1);
        var cl = esq ? 'crt so' : 'crt';
        if (j === k && c.dataset.topo !== '1' && g.dataset.pronto) cl += ' sobe';
        c.dataset.topo = j === k ? '1' : '';
        c.className = cl;
      });
    }
    cs.forEach(function (c, k) { c.addEventListener('mouseenter', function () { topo(k); }); });
    topo(0); g.dataset.pronto = '1';
    grupos.push({ g: g, n: n, topo: topo, k: 0 });
  });
  // sem mouse (celular): a rolagem embaralha; conforme o grupo atravessa a tela,
  // cada tela passa a vez para a seguinte
  if (window.matchMedia && matchMedia('(hover: none)').matches && grupos.length) {
    var pend = false;
    function rola() {
      pend = false;
      grupos.forEach(function (o) {
        var r = o.g.getBoundingClientRect();
        if (r.bottom < 0 || r.top > innerHeight) return;
        var p = (innerHeight * 0.62 - (r.top + r.height / 2)) / (innerHeight * 0.24);
        var k = Math.max(0, Math.min(o.n - 1, Math.floor(p * o.n)));
        if (k !== o.k) { o.k = k; o.topo(k); }
      });
    }
    addEventListener('scroll', function () { if (!pend) { pend = true; requestAnimationFrame(rola); } }, { passive: true });
    rola();
  }
  var tx = null;
  z.addEventListener('touchstart', function (e) { tx = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive: true});
  z.addEventListener('touchend', function (e) {
    if (tx === null || z.className.indexOf('big') >= 0) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 60) mostra(atual + (dx < 0 ? 1 : -1));
  });
  function fecha() { z.className = 'zoom'; zi.src = ''; document.body.style.overflow = ''; }
  document.getElementById('zoomx').addEventListener('click', fecha);
  z.addEventListener('click', function (e) { if (e.target === z) fecha(); });
  zi.addEventListener('click', function (e) {
    var big = z.className.indexOf('big') < 0;
    var rx = e.offsetX / zi.clientWidth, ry = e.offsetY / zi.clientHeight;
    z.className = big ? 'zoom on big' : 'zoom on';
    if (big) { z.scrollLeft = rx * zi.clientWidth - innerWidth / 2; z.scrollTop = ry * zi.clientHeight - innerHeight / 2; }
  });
  document.addEventListener('keydown', function (e) { if (z.className.indexOf('on') < 0) return;
    if (e.key === 'Escape') fecha();
    else if (e.key === 'ArrowLeft') mostra(atual - 1);
    else if (e.key === 'ArrowRight') mostra(atual + 1); });
})();
</script>
</body>
</html>
